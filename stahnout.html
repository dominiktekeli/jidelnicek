<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Přístup — Klid v kuchyni</title>
    <link rel="stylesheet" href="site.css" />
    <meta name="theme-color" content="#2d9a6a" />
    <link rel="icon" href="images/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="images/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" href="images/android-chrome-192x192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="images/android-chrome-512x512.png" sizes="512x512" type="image/png" />
  </head>
  <body>
    <header class="nav">
      <a class="nav__logo" href="./" aria-label="Klid v kuchyni — domů">
        <img class="nav__logo-img" src="images/logo.svg" alt="Klid v kuchyni" width="132" height="24" decoding="async" />
      </a>
    </header>

    <div class="page-narrow">
      <h1>Už mám zakoupeno</h1>
      <p class="hero__lead" id="gate-lead">
        Zadej heslo z e-mailu. Nebo přejdi ze stránky po zaplacení — tam není heslo potřeba.
      </p>

      <form class="gate-form" id="gate-form">
        <label for="pass" style="display: block; text-align: left; font-weight: 600; margin-bottom: 0.35rem"
          >Heslo z e-mailu</label
        >
        <input
          type="password"
          id="pass"
          name="pass"
          autocomplete="current-password"
          placeholder="Heslo"
          required
        />
        <button type="submit" class="btn btn--primary">Vstoupit do aplikace</button>
      </form>

      <p class="msg-error" id="gate-error" hidden>Špatné heslo. Zkontroluj e-mail.</p>

      <p style="margin-top: 2rem; font-size: 0.95rem; color: var(--muted)">
        Právě jsi platila? <a href="dekujeme.html"><strong>Otevřít aplikaci hned</strong></a>
      </p>
    </div>

    <div id="site-legal-footer"></div>

    <script src="config.js"></script>
    <script src="legal.js"></script>
    <script src="access.js"></script>
    <script>
      (function () {
        function goApp() {
          window.location.href = "app/";
        }

        if (window.KLID_ACCESS && KLID_ACCESS.has()) {
          goApp();
          return;
        }

        var cfg = window.KLID_CONFIG || {};
        document.getElementById("gate-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var val = document.getElementById("pass").value.trim();
          var err = document.getElementById("gate-error");
          if (val && val === cfg.downloadPassword) {
            KLID_ACCESS.grant();
            goApp();
          } else {
            err.hidden = false;
          }
        });
      })();
    </script>
  </body>
</html>
